<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ADD8" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ADD8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="4" />

  <!-- Background Geometric Orbit Tracks -->
  <g opacity="0.2" stroke="#475569" stroke-width="1.5">
    <circle cx="256" cy="256" r="210" fill="none" stroke-dasharray="6 8" />
    <circle cx="256" cy="256" r="160" fill="none" />
    <circle cx="256" cy="256" r="110" fill="none" stroke-dasharray="4 6" />
    <line x1="256" y1="46" x2="256" y2="466" />
    <line x1="46" y1="256" x2="466" y2="256" />
  </g>

  <!-- Outer Orbit Nodes -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#accent-cyan)" stroke-width="3" opacity="0.5" stroke-dasharray="40 20 80 20" />
  <g fill="#0B0F19" stroke-width="3">
    <circle cx="256" cy="71" r="14" stroke="#00ADD8" />
    <circle cx="256" cy="71" r="5" fill="#00ADD8" />
    <circle cx="441" cy="256" r="14" stroke="#10B981" />
    <circle cx="441" cy="256" r="5" fill="#10B981" />
    <circle cx="256" cy="441" r="14" stroke="#F59E0B" />
    <circle cx="256" cy="441" r="5" fill="#F59E0B" />
    <circle cx="71" cy="256" r="14" stroke="#00ADD8" />
    <circle cx="71" cy="256" r="5" fill="#00ADD8" />
  </g>

  <!-- Central Emblem Geometry -->
  <g filter="url(#glow)">

    <!-- Terminal Chevron Motif -->
    <rect x="150" y="160" width="212" height="160" rx="16" fill="#0B0F19" stroke="#00ADD8" stroke-width="5" />
    <!-- Header Window Dots -->
    <circle cx="175" cy="182" r="5" fill="#EF4444" />
    <circle cx="195" cy="182" r="5" fill="#F59E0B" />
    <circle cx="215" cy="182" r="5" fill="#10B981" />
    <!-- Chevron >_ -->
    <path d="M 180 220 L 210 245 L 180 270" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="225" y1="270" x2="260" y2="270" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
        
  </g>

  <!-- Bus Trajectory Pulses -->
  <circle cx="176" cy="134" r="4" fill="#00ADD8" filter="url(#glow)" />
  <circle cx="336" cy="134" r="4" fill="#10B981" filter="url(#glow)" />
  <circle cx="336" cy="378" r="4" fill="#F59E0B" filter="url(#glow)" />
  <circle cx="176" cy="378" r="4" fill="#00ADD8" filter="url(#glow)" />
</svg>
