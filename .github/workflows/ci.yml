name: CI Security & Verification Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  adversarial-review:
    name: Koality Assured Adversarial Security Gate
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Execute Adversarial Security Review
        run: |
          python adversarial_review.py

      - name: Execute Pester Test Suite
        shell: pwsh
        run: |
          $pesterResult = Invoke-Pester -Path tests/PowershellScripts.Tests.ps1 -PassThru
          if ($pesterResult.FailedCount -gt 0) {
            Write-Error "Pester tests failed: $($pesterResult.FailedCount)"
            exit 1
          } else {
            Write-Host "All Pester tests passed cleanly!" -ForegroundColor Green
          }
